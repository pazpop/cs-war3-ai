# The game server, the AI relay, FastDL and the stats page. On the PC as on the VPS:
#   docker compose up -d --build
# On the PC, without a .env: DOMAIN=localhost docker compose up -d --build
# HLDS's console: docker attach cs-war3-ai-hlds-1 (leave with Ctrl+P then Ctrl+Q; Ctrl+C stops the server
# cleanly, and Docker starts it again).

# Every container: no Linux capabilities (unless listed), no way to gain more (setuid), and a cap on processes (a
# fork bomb stays inside).
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256

services:
  hlds:
    <<: *hardening
    build: server
    image: cs-war3-ai-hlds
    # Its own network, shared only with the AI relay: the game cannot reach PHP (stats:9000) if it is ever taken over.
    networks: [game, ai]
    restart: unless-stopped
    # The clean quit saves the XP, the ranking and every player's achievements: more time than Docker's 10 seconds.
    stop_grace_period: 30s
    ports:
      - "27015:27015/udp"
    environment:
      # DOMAIN, RCON and ADMINS: in .env, written by Ansible (the secrets come from the vault).
      DOMAIN: ${DOMAIN:?}
      RCON: ${RCON:-}
      ADMINS: ${ADMINS:-}
      UPDATE: ${UPDATE:-0}  # UPDATE=1 docker compose up -d: reinstall or update CS 1.6
      TICRATE: ${TICRATE:-1000}  # TICRATE=100 docker compose up -d: back to Valve's default
    # HLDS's console waits for input: without a terminal, it spins.
    stdin_open: true
    tty: true
    volumes:
      - hlds:/hlds
      # The VPS's time zone (a container is in UTC otherwise), like the AI relay and the stats page: logs, /thetime,
      # the month.
      - /etc/localtime:/etc/localtime:ro

  # The AI relay (ai/relay.py): the game's plugin (server/plugins/ai.sma) asks it, it asks Claude. Only the game
  # can reach it, at a fixed address (the plugin does not look up names: a lookup can block the game); its port is
  # not published. Without ANTHROPIC_API_KEY, it stays silent.
  ai:
    <<: *hardening
    # From the repository's root, for the bots' list (server/bots.txt): see .dockerignore.
    build:
      context: .
      dockerfile: ai/Dockerfile
    image: cs-war3-ai-ai
    restart: unless-stopped
    # Caps on memory and CPU, like the stats page and both Caddys: the VPS has no swap, and a leak or a flood of
    # requests must stop or slow this container, not the game (the game has none).
    mem_limit: 256m
    cpus: 0.5
    # Nothing to write but its database (a volume) and SQLite's temporary files.
    read_only: true
    tmpfs: [/tmp]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The most it spends in a day, in dollars; then it is silent until midnight (the VPS's time). 0: the AI is off.
      AI_DAILY_USD: ${AI_DAILY_USD:-1}
    # game: its way out to the API.
    networks:
      game:
      ai:
        ipv4_address: 10.27.15.10
    volumes:
      - ai:/data
      - /etc/localtime:/etc/localtime:ro

  # The stats page: PHP reads War3FT's SQLite database, and nothing else from the volume, read-only.
  stats:
    <<: *hardening
    image: php:8.5-fpm-alpine
    mem_limit: 256m
    cpus: 0.5
    # The game is on another network: status.php asks it through the port the host publishes.
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    # As the game's user, from the start: without capabilities, PHP could not switch to its own user.
    user: "1000:1000"
    # No access log: the image's own writes every visitor's IP address into Docker's logs.
    configs:
      - source: php-no-access-log
        target: /usr/local/etc/php-fpm.d/zz-no-access-log.conf
    environment:
      # The VPS's time zone, by name: PHP does not read /etc/localtime. In .env, written by Ansible.
      TIMEZONE: ${TIMEZONE:-UTC}
    # After hlds: its container fills the new volume first (see the Dockerfile).
    depends_on: [hlds]
    volumes:
      - ./stats:/srv/stats:ro
      # For SQLite's 'localtime' (the month of the ranking).
      - /etc/localtime:/etc/localtime:ro
      # The bots' list, for stats/bots.php. The folder, not the file: Ansible replaces the file, and a file mounted
      # alone would keep the old one.
      - ./server:/srv/server:ro
      # The AI relay's database, for the bots' latest lines (stats/bots.php), read-only.
      - type: volume
        source: ai
        target: /ai
        read_only: true
      - type: volume
        source: hlds
        target: /data
        read_only: true
        volume:
          subpath: cstrike/addons/amxmodx/data/sqlite3

  # FastDL: the game's files over HTTP, behind the front. It reads the whole game volume, read-only, but serves
  # only the files players download, and holds no certificate (see caddy/fastdl.Caddyfile).
  fastdl:
    <<: *hardening
    # The image's caddy program needs this one to start (it is set on the file).
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2.11-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    command: ["caddy", "run", "--config", "/etc/caddy/fastdl.Caddyfile"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - hlds:/srv/hlds:ro

  # The front: the stats pages and the guide (HTTP and HTTPS), FastDL passed on to "fastdl".
  caddy:
    <<: *hardening
    # The image's caddy program needs this one to start (it is set on the file).
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2.11-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      # The folder, not the file: Ansible replaces the file, and a file mounted alone would keep the old one.
      - ./caddy:/etc/caddy:ro
      - ./stats:/srv/stats:ro
      - caddy:/data

volumes:
  hlds:
  caddy:
  ai:

configs:
  # Read after the image's own PHP-FPM settings (zz-: last in alphabetical order), so it wins.
  php-no-access-log:
    content: |
      [www]
      access.log = /dev/null

networks:
  # The game alone, and its AI relay.
  game:
  # Between the game and its AI relay. Internal (no way out): both go out through "game". A fixed range, for the
  # relay's address (outside Docker's own ranges).
  ai:
    internal: true
    ipam:
      config:
        - subnet: 10.27.15.0/24
