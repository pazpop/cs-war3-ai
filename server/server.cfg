// Server settings. The entrypoint adds the name and the FastDL address (from DOMAIN).
// The rcon password comes from the RCON variable, not from here (the repository is public).
mapcyclefile "mapcycle.txt"  // official maps that the YaPB bots know
sv_region 0                  // 0 = North America, east coast
// The map's length (20 minutes) is in ReGameDLL's game.cfg, read after this file (server/Dockerfile).
// Per-player bandwidth: a CS 1.6 server needs little. A client gets about 100 updates per second at most.
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 30
sv_allowdownload 1           // required for FastDL (sv_downloadurl)
sv_allow_dlfile 0            // no download through the game itself: it would serve any file, the databases too
sv_allowupload 0             // no custom sprays: anyone could show any image to everyone
pausable 0                   // no "pause" from a player's console: it would freeze the game for everyone
log on
mp_logecho 0                 // the log (IPs, team chat) stays in its files, 14 days: not copied into Docker's logs
redm_update_notify 0         // no update check for ReDeathmatch: it needs a module we do not install
