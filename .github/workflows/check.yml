# Checks every push and pull request: the playbooks, the shell scripts, the PHP pages, and the game image
# (building it checks the mods' SHA-256 and compiles our AMX Mod X plugins).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Its own venv: the runner's preinstalled Ansible hides the collections from ansible-lint.
      # The real personal.yml and vault are not in the repository: placeholders, only for the checks.
      - name: Ansible
        run: |
          python3 -m venv ~/lint
          . ~/lint/bin/activate
          pip install ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          cp ansible/personal.example.yml ansible/personal.yml
          echo 'vault_rcon: ci-placeholder-1234' > ansible/vault.yml
          ansible-lint ansible/init.yml ansible/config.yml ansible/deploy.yml ansible/backup.yml

      - name: Shell scripts
        run: shellcheck vault.sh deploy-all.sh ansible/vault-password.sh ansible/files/backup.sh server/entrypoint.sh

      - name: Python
        run: |
          python3 -m py_compile ansible/files/heartbeat.py ansible/files/collect.py ansible/files/chat_report.py ai/relay.py
          python3 -m unittest discover ai
          python3 -m unittest discover ansible/files

      # The PHP image of compose.yml, which Renovate updates.
      - name: PHP
        run: |
          image=$(grep -o 'php:[^ ]*' compose.yml)
          docker run --rm -v "$PWD/stats:/stats:ro" "$image" sh -c 'for f in /stats/*.php; do php -l "$f"; done'

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the game image
        run: docker build server

      - name: Build the AI relay's image
        run: docker build -f ai/Dockerfile .
