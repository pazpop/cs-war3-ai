# The VPS. Ansible connects with the "deploy" account and its SSH key.
# The very first run (init.yml) uses the hosting provider's account instead.
all:
  hosts:
    cs:
      # The server's public name: game, FastDL, stats page and HTTPS certificate.
      domain: cs.pazpop.net
      ansible_host: "{{ domain }}"
      ansible_port: 2222
      ansible_user: deploy
      ansible_ssh_private_key_file: ~/.ssh/cs_pazpop_net
      ansible_python_interpreter: /usr/bin/python3
      # 60 s instead of 10: a shared VPS can freeze for several seconds, and sudo waits too.
      ansible_timeout: 60
      timezone: America/Toronto
      # The servers whose player counts are added to /srv/collect/players.csv every 5 minutes (files/collect.py).
      collect_domains: [cs.pazpop.net]
